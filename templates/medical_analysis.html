{% extends "base.html" %}

{% block title %}Medical Document Analysis{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white text-center">
            <h3>Medical Document Analysis</h3>
        </div>
        <div class="card-body">
            <p><strong>Predicted Premium:</strong> {{ premium }}</p>
            <p><strong>Risk Score:</strong> {{ risk_score }}</p>

            <div class="alert alert-info mt-3">
                <h5>Generated Medical Summary</h5>
                <p>{{ summary }}</p>
            </div>

                <a href="{{ url_for('analyze_medical_document') }}" class="btn btn-outline-secondary">Analyze Another Document</a>
            </div> -->
        </div>
    </div>
</div>
{% endblock %}
