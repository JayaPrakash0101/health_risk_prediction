{% extends 'base.html' %}

{% block content%}
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 ">
      <div class="col-md-3 mb-2 mb-md-0">
        <a href="{{ url_for('index') }}" class="d-inline-flex link-body-emphasis text-decoration-none">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Smart Underwriting Logo" style="width: 100px; height: 100px;">
        </a>
      </div>
      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
      </ul>

      <div class="col-md-3 text-end">
        <a href="{{ url_for('login') }}"><button type="button" class="btn btn-outline-primary me-2">Login</button></a>
        <a href="{{ url_for('register') }}"><button type="button" class="btn btn-primary">Sign-up</button></a>
      </div>
    </header>

  <div class="container-fluid position-relative overflow-hidden p-3 p-md-5 m-md-3 text-center bg-body-tertiary w-100">
    <div class="col-md-6 mx-auto my-5">
      <h1 class="display-1 fw-bold">Smart Health Underwriting System</h1>

    </div>
  </div>

  <br>
