{% extends 'base.html' %}

{% block title %}Login Page{% endblock %}

{% block content %}
    <main class="form-signin w-100 m-auto" style="max-width: 330px;">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Smart Underwriting Logo" style="width: 200px; height: 200px;" class="mb-4">
        <h1 class="h3 mb-3 fw-normal">{% block header %}Login here{% endblock %}</h1>
        {% block form_content %}
        <form method="post" action="">
            
            <div class="form-floating" style="margin-bottom: 5px;">
                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" name="email" required>
                <label for="floatingInput">Email address</label>
            </div>
            <div class="form-floating" style="margin-bottom: 15px;">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password" name="password" required>
                <label for="floatingPassword">Password</label>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
        </form>
        <br>
        <p style="color: cyan;"><a href="{{ url_for('register') }}">New user? Sign up here!</a></p>
        {% endblock form_content %}
    </main>
{% endblock %}
